# ld65 layout for the ppu.toys TG16 ROM player: one 8 KB bank mapped at
# $E000 (MPR7 = bank 0 at reset). The ROM exporter patches CONFIG and
# appends the frame stream from bank 1 on.
MEMORY {
    ZP:   start = $0000, size = $0100, type = rw;
    RAM:  start = $2200, size = $1E00, type = rw;
    ROM:  start = $E000, size = $2000, type = ro, fill = yes, fillval = $FF, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = bss;
    CODE:     load = ROM, type = ro, start = $E000;
    CONFIG:   load = ROM, type = ro, start = $FF00;
    VECTORS:  load = ROM, type = ro, start = $FFF6;
}
